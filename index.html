
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Central de Inteligência | Decole</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"/>
  <style>
    body { background-color: #0d1117; color: #f0f0f0; font-family: Arial, sans-serif; }
    .container { padding: 20px; }
    #logo { max-height: 70px; display: block; margin: 20px auto; }
    h2 { color: #FFA726; text-align: center; margin-bottom: 30px; }
    canvas { background-color: #1c1f26; border-radius: 10px; padding: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.4); }
    .charts-section { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 30px; }
    .chart-card { padding: 10px; }
    .table-responsive { margin-top: 40px; }
    table.dataTable td, table.dataTable th { color: #fff; }
  </style>
</head>
<body>
  <div class="container">
    <img src="logo.png" id="logo" alt="Logo Decole"/>
    <h2>Dashboard de Ocorrências</h2>

    <div class="charts-section">
      <div class="chart-card"><canvas id="graficoStatus"></canvas></div>
      <div class="chart-card"><canvas id="graficoEmpresas"></canvas></div>
      <div class="chart-card"><canvas id="graficoDescricoes"></canvas></div>
      <div class="chart-card"><canvas id="graficoOcorrencias"></canvas></div>
    </div>

    <div class="table-responsive">
      <h4 class="mt-5 text-warning">Tabela Geral de Atendimentos</h4>
      <table id="tabelaRelatorio" class="table table-dark table-striped">
        <thead>
          <tr>
            <th>Data</th>
            <th>Empresa</th>
            <th>Descrição</th>
            <th>Status</th>
            <th>Prioridade</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.0/dist/jquery.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
