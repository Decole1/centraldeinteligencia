
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard de Ocorrências | Decole</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"/>
  <style>
    body { background-color: #121212; color: #f0f0f0; }
    .container { padding: 30px; }
    h2, h4 { color: #FFA726; }
    canvas { background-color: #fff; border-radius: 8px; }
    #logo { max-height: 80px; margin-bottom: 20px; }
    table.dataTable { color: #fff; }
  </style>
</head>
<body>
  <div class="container text-center">
    <img src="logo.png" id="logo" alt="Logo Decole"/>
    <h2>Dashboard de Ocorrências</h2>
    <div class="row my-4">
      <div class="col-md-6"><canvas id="graficoStatus"></canvas></div>
      <div class="col-md-6"><canvas id="graficoEmpresas"></canvas></div>
    </div>
    <div class="row my-4">
      <div class="col-12"><canvas id="graficoDescricoes"></canvas></div>
    </div>
    <div class="row my-4">
      <div class="col-12">
        <h4 class="text-start">Tabela Geral de Atendimentos</h4>
        <table id="tabelaRelatorio" class="table table-dark table-striped" style="width:100%;">
          <thead>
            <tr>
              <th>Data</th><th>Empresa</th><th>Descrição</th><th>Status</th><th>Prioridade</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.0/dist/jquery.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
