
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Ocorrências | Decole</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"/>
  <style>
    body { background-color: #0a192f; color: #fff; font-family: 'Segoe UI', sans-serif; }
    .logo { max-height: 80px; display: block; margin: 20px auto; }
    h2 { text-align: center; color: #FFA726; margin-bottom: 40px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; padding: 0 30px; }
    canvas { background-color: #112240; border-radius: 16px; padding: 20px; }
    .table-container { padding: 0 30px 40px; }
    .badge { font-size: 0.8rem; padding: 4px 10px; border-radius: 5px; }
    .badge.Pendente { background-color: #f44336; }
    .badge["Em andamento"] { background-color: #ff9800; }
    .badge.Finalizada, .badge.Finalizado { background-color: #4caf50; }
    table.dataTable td, table.dataTable th { color: #fff; }
    .dataTables_wrapper .dataTables_filter input { background-color: #0f2a44; color: #fff; border: 1px solid #294a6f; }
    .dataTables_wrapper .dataTables_paginate .paginate_button { color: #fff !important; }
  </style>
</head>
<body>
  <img src="logo.png" class="logo" alt="Logo Decole">
  <h2>Dashboard de Ocorrências</h2>

  <div class="grid">
    <canvas id="graficoStatus"></canvas>
    <canvas id="graficoEmpresas"></canvas>
    <canvas id="graficoDescricoes"></canvas>
  </div>

  <div class="table-container">
    <div class="container">
      <h4 class="text-warning mt-5 mb-3">Tabela Geral de Atendimentos</h4>
      <div class="table-responsive">
        <table id="tabelaRelatorio" class="table table-dark table-striped">
          <thead>
            <tr>
              <th>Ocorrência</th>
              <th>Empresa</th>
              <th>Descrição</th>
              <th>Data</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.0/dist/jquery.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
